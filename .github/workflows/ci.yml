name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: tools/verify_prereg_ledger.py hashes each pre-registration
      # at the commit that introduced it. A depth-1 checkout makes every file
      # look added at HEAD, which silently verifies unedited files against the
      # wrong commit and misreports edited ones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only torch keeps the install small; the suite uses tiny models.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Test suite
        run: python -m pytest -q

      - name: Results data still matches its logs
        run: python tools/collect_results.py --check

      - name: Pre-registration ledger verifies
        run: python tools/verify_prereg_ledger.py

      # Both of these existed and passed and were wired into nothing. A gate
      # that nothing invokes is a convention with a script attached -- the
      # 2026-10-18 audit found eight incidents in that class, and nine public
      # claims that a checker would have caught.
      - name: Notebooks are statically clean
        run: python tools/check_notebooks.py

      - name: Public documents agree with the record
        run: python tools/audit_claims.py --check

      # The archive is uneven for historical reasons and nothing made that
      # visible. This fails when the registry stops matching what is on disk, so
      # a run whose evidence goes missing shows up as a diff rather than a
      # silence.
      - name: Every run's evidence is where the registry says it is
        run: python tools/build_runs_registry.py --check
