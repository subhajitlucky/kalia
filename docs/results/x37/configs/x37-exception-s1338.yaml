model:
  vocab_size: 50257
  n_layer: 6
  n_head: 6
  n_embd: 384
  context_len: 512
  dropout: 0.0
  qk_norm: true
  logit_softcap: 0.0
  sutra_rules: 64
  sutra_rank: 8
  sutra_general_hidden: 1024
  sutra_chunk: 64
  sutra_carry_dim: 64
  sutra_balance: 0.01
  sutra_top_k: 1
  sutra: true
  sutra_carry: true
  sutra_scope: true
  sutra_exception: true
train:
  optimizer: muon
  muon_learning_rate: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  ns_steps: 5
  micro_batch_size: 16
  grad_accum_steps: 8
  max_steps: 763
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 40
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 20
  sample_interval: 0
  sample_tokens: 40
  checkpoint_interval_minutes: 0
  log_interval: 10
  seed: 1338
