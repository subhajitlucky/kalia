model:
  vocab_size: 32000
  n_layer: 6
  n_head: 6
  n_embd: 384
  context_len: 512
  dropout: 0.0
  qk_norm: true
  logit_softcap: 30.0
train:
  optimizer: adamw
  micro_batch_size: 16
  grad_accum_steps: 8
  max_steps: 4770
  learning_rate: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 40
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_steps: 20
  sample_interval: 0
  sample_tokens: 40
  checkpoint_interval_minutes: 30
  log_interval: 10
  seed: 1338
  doc_mask: false
