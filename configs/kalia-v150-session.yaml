# X64 v150 full continued pretraining — multi-session config.
#
# One 7.5-hour Kaggle session per run. `max_steps` is the absolute ceiling;
# `update_budget` is the per-session cap once a checkpoint exists. `rewarm:
# false` continues the cosine schedule from the absolute step instead of
# restarting warmup every session.
model:
  vocab_size: 50257
  n_layer: 38
  n_head: 8
  n_embd: 512
  context_len: 1024
  dropout: 0.0
  qk_norm: true
  logit_softcap: 30.0
train:
  optimizer: muon
  muon_learning_rate: 0.01
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  ns_steps: 5
  micro_batch_size: 2
  grad_accum_steps: 128
  max_steps: 4770
  update_budget: 450
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 100
  sample_interval: 0
  sample_tokens: 80
  checkpoint_interval_minutes: 30
  log_interval: 10
  seed: 1501
  rewarm: false
