model:
  vocab_size: 256
  n_layer: 2
  n_head: 2
  n_embd: 64
  context_len: 64
  dropout: 0.0
train:
  optimizer: muon
  muon_learning_rate: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  ns_steps: 5
  micro_batch_size: 4
  grad_accum_steps: 2
  max_steps: 6
  learning_rate: 1.0e-3
  min_lr_ratio: 0.1
  warmup_steps: 2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 3
  eval_steps: 2
  sample_interval: 0
  sample_tokens: 16
  checkpoint_interval_minutes: 0
  log_interval: 1
  seed: 1337
