# Smoke config for the v0.3.1 depth-expand. Validates initialization, memory and
# throughput; it is not the registered 150M experiment.
model:
  vocab_size: 50257
  n_layer: 38
  n_head: 8
  n_embd: 512
  context_len: 1024
  dropout: 0.0
  qk_norm: true
  logit_softcap: 30.0
train:
  optimizer: muon
  muon_learning_rate: 0.01
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  ns_steps: 5
  micro_batch_size: 2
  grad_accum_steps: 128
  max_steps: 300
  update_budget: 300
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 30
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 20
  sample_interval: 0
  sample_tokens: 80
  checkpoint_interval_minutes: 20
  log_interval: 10
  seed: 1502
  rewarm: true
